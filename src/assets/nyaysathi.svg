    <text x="374" y="336" fill="#ffffff" font-size="44" font-weight="700">248</text>
    <text x="560" y="336" fill="#34d399" font-size="18">&#9650; 12%</text>
  </g>
  <g>
    <rect x="726" y="230" width="360" height="150" rx="20" fill="#1b1036" stroke="#2e1f57"/>
    <text x="758" y="278" fill="#8d81b3" font-size="17">Auto-Resolved by AI</text>
    <text x="758" y="336" fill="#ffffff" font-size="44" font-weight="700">61%</text>
    <text x="944" y="336" fill="#34d399" font-size="18">&#9650; 8%</text>
  </g>
  <g>
    <rect x="1110" y="230" width="360" height="150" rx="20" fill="#1b1036" stroke="#2e1f57"/>
    <text x="1142" y="278" fill="#8d81b3" font-size="17">Avg. Response Time</text>
    <text x="1142" y="336" fill="#ffffff" font-size="44" font-weight="700">3.4h</text>
    <text x="1318" y="336" fill="#34d399" font-size="18">&#9660; 21%</text>
  </g>
  <g>
    <rect x="1494" y="230" width="342" height="150" rx="20" fill="#1b1036" stroke="#2e1f57"/>
    <text x="1526" y="278" fill="#8d81b3" font-size="17">High Priority</text>
    <text x="1526" y="336" fill="#ffffff" font-size="44" font-weight="700">17</text>
    <text x="1660" y="336" fill="#f87171" font-size="18">urgent</text>
  </g>

  <!-- chart panel -->
  <rect x="342" y="416" width="880" height="470" rx="22" fill="#1b1036" stroke="#2e1f57"/>
