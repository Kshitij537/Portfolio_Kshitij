  <text x="342" y="150" fill="#ffffff" font-size="38" font-weight="700">Complaint Management</text>
  <text x="342" y="188" fill="#8d81b3" font-size="19">Multi-agent LangGraph workflow &#183; live case monitoring</text>
  <rect x="1560" y="112" width="150" height="48" rx="14" fill="#915EFF"/>
  <text x="1590" y="143" fill="#ffffff" font-size="18" font-weight="600">New Case</text>
