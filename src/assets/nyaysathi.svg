<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 990" width="1920" height="990" font-family="Poppins, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="ns-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150a2e"/>
      <stop offset="0.55" stop-color="#1d0f3d"/>
      <stop offset="1" stop-color="#0d0620"/>
    </linearGradient>
    <linearGradient id="ns-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#915EFF"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="ns-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#915EFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#915EFF"/>
    </linearGradient>
    <linearGradient id="ns-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#915EFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#915EFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="990" rx="28" fill="url(#ns-bg)"/>
  <circle cx="1620" cy="140" r="420" fill="url(#ns-glow)"/>

  <!-- browser chrome -->
  <rect x="0" y="0" width="1920" height="72" rx="28" fill="#0b0518"/>
  <rect x="0" y="44" width="1920" height="28" fill="#0b0518"/>
  <circle cx="46" cy="36" r="10" fill="#ff5f57"/>
  <circle cx="80" cy="36" r="10" fill="#febc2e"/>
  <circle cx="114" cy="36" r="10" fill="#28c840"/>
  <rect x="160" y="20" width="520" height="32" rx="16" fill="#1c1233"/>
  <text x="184" y="43" fill="#8b7fb0" font-size="18">nyaysathi.app / dashboard</text>

  <!-- sidebar -->
  <rect x="0" y="72" width="290" height="918" fill="#120829"/>
  <rect x="36" y="120" width="40" height="40" rx="12" fill="url(#ns-accent)"/>
  <text x="92" y="149" fill="#ffffff" font-size="26" font-weight="700">NyaySathi</text>
  <text x="36" y="215" fill="#6f6395" font-size="15" letter-spacing="2">WORKSPACE</text>

  <rect x="24" y="238" width="242" height="52" rx="14" fill="#915EFF" fill-opacity="0.18"/>
  <rect x="24" y="238" width="4" height="52" rx="2" fill="#915EFF"/>
  <rect x="52" y="257" width="18" height="14" rx="4" fill="#915EFF"/>
