    <rect x="502" y="640" width="70" height="180" rx="10" fill="url(#ns-bar)"/>
    <rect x="612" y="560" width="70" height="260" rx="10" fill="url(#ns-bar)"/>
    <rect x="722" y="672" width="70" height="148" rx="10" fill="url(#ns-bar)"/>
    <rect x="832" y="596" width="70" height="224" rx="10" fill="url(#ns-bar)"/>
    <rect x="942" y="716" width="70" height="104" rx="10" fill="url(#ns-bar)"/>
    <rect x="1052" y="660" width="70" height="160" rx="10" fill="url(#ns-bar)"/>
