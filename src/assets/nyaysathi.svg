    <text x="392" y="866" fill="#6f6395" font-size="15">Civil</text>
    <text x="502" y="866" fill="#6f6395" font-size="15">Labour</text>
    <text x="612" y="866" fill="#6f6395" font-size="15">Consumer</text>
    <text x="722" y="866" fill="#6f6395" font-size="15">Cyber</text>
    <text x="832" y="866" fill="#6f6395" font-size="15">Property</text>
    <text x="942" y="866" fill="#6f6395" font-size="15">Family</text>
    <text x="1052" y="866" fill="#6f6395" font-size="15">Other</text>
  </g>

  <!-- agent workflow panel -->
  <rect x="1246" y="416" width="590" height="470" rx="22" fill="#1b1036" stroke="#2e1f57"/>
  <text x="1282" y="468" fill="#ffffff" font-size="24" font-weight="600">Agent Pipeline</text>

  <g>
    <circle cx="1302" cy="530" r="12" fill="#915EFF"/>
    <line x1="1302" y1="542" x2="1302" y2="592" stroke="#3a2a68" stroke-width="3"/>
    <text x="1336" y="524" fill="#ffffff" font-size="19">Intake &amp; Validation</text>
    <text x="1336" y="550" fill="#7f74a6" font-size="15">Complaint parsed &#183; 0.8s</text>

    <circle cx="1302" cy="604" r="12" fill="#915EFF"/>
    <line x1="1302" y1="616" x2="1302" y2="666" stroke="#3a2a68" stroke-width="3"/>
    <text x="1336" y="598" fill="#ffffff" font-size="19">Legal Classification</text>
    <text x="1336" y="624" fill="#7f74a6" font-size="15">Consumer Protection Act</text>

    <circle cx="1302" cy="678" r="12" fill="#915EFF"/>
    <line x1="1302" y1="690" x2="1302" y2="740" stroke="#3a2a68" stroke-width="3"/>
    <text x="1336" y="672" fill="#ffffff" font-size="19">Priority Scoring</text>
    <text x="1336" y="698" fill="#7f74a6" font-size="15">Compliance deadline: 14 days</text>

    <circle cx="1302" cy="752" r="12" fill="#22d3ee"/>
    <line x1="1302" y1="764" x2="1302" y2="814" stroke="#3a2a68" stroke-width="3" stroke-dasharray="6 6"/>
    <text x="1336" y="746" fill="#ffffff" font-size="19">Document Drafting</text>
    <text x="1336" y="772" fill="#7f74a6" font-size="15">Generating notice&#8230;</text>

    <circle cx="1302" cy="826" r="12" fill="none" stroke="#4b3f74" stroke-width="3"/>
    <text x="1336" y="820" fill="#6f6395" font-size="19">Staff Assignment</text>
    <text x="1336" y="846" fill="#5b5182" font-size="15">Queued</text>
  </g>
