  <rect x="52" y="316" width="18" height="14" rx="4" fill="#4b3f74"/>
  <text x="86" y="329" fill="#9b90bd" font-size="19">Complaints</text>
  <rect x="52" y="375" width="18" height="14" rx="4" fill="#4b3f74"/>
  <text x="86" y="388" fill="#9b90bd" font-size="19">AI Analysis</text>
  <rect x="52" y="434" width="18" height="14" rx="4" fill="#4b3f74"/>
  <text x="86" y="447" fill="#9b90bd" font-size="19">Documents</text>
  <rect x="52" y="493" width="18" height="14" rx="4" fill="#4b3f74"/>
  <text x="86" y="506" fill="#9b90bd" font-size="19">Staff Assignment</text>
  <rect x="52" y="552" width="18" height="14" rx="4" fill="#4b3f74"/>
  <text x="86" y="565" fill="#9b90bd" font-size="19">Case Priority</text>
  <rect x="52" y="611" width="18" height="14" rx="4" fill="#4b3f74"/>
